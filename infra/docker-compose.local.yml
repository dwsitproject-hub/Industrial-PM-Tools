# EngPro — LOCAL all-in-one stack (database + backend + frontend behind nginx).
# Run from the repo root:  docker compose -f infra/docker-compose.local.yml up -d --build
# App: http://localhost:8090
name: engpro

services:
  db:
    image: postgres:16-alpine
    container_name: engpro-db
    environment:
      POSTGRES_USER: engpro
      POSTGRES_PASSWORD: engpro
      POSTGRES_DB: industrial_pm
    volumes:
      - engpro-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5440:5432"   # host access for the one-time legacy ETL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engpro -d industrial_pm"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: engpro-api
    environment:
      DATABASE_URL: postgresql://engpro:engpro@db:5432/industrial_pm
      JWT_ACCESS_SECRET: local_access_secret_change_me_1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e
      JWT_REFRESH_SECRET: local_refresh_secret_change_me_9f8e7d6c5b4a3928171605f4e3d2c1b0
      ACCESS_TTL: 15m
      REFRESH_TTL_DAYS: "7"
      CORS_ORIGIN: http://localhost:8090
      WORKSPACE_TZ: Asia/Jakarta
      THROTTLE_LIMIT: "5"
      COOKIE_SECURE: "false"
      PORT: "3000"
      APP_BASE_URL: http://localhost:8090
      MAIL_FROM: EngPro <no-reply@engpro.local>
      ACTIVATION_TTL_HOURS: "72"
      RESET_TTL_MINUTES: "60"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: engpro-web
    ports:
      - "8090:80"
    volumes:
      - ../frontend/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  engpro-pgdata:
