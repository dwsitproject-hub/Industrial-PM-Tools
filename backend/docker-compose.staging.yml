# EngPro BACKEND — STAGING (BE server 172.28.92.57)
# API bound to the private IP only (same pattern as the other staging APIs on this host).
# Database is ApsaraDB RDS — no database container here.
# Run from /opt/industrial_pm/backend :  docker compose -f docker-compose.staging.yml up -d --build
# Requires .env.staging in this folder (see .env.staging.example).
name: engpro-staging-be

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: engpro-api:staging
    container_name: engpro-staging-api
    env_file: .env.staging
    ports:
      - "172.28.92.57:4010:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
