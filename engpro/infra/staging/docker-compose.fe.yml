# EngPro STAGING — FE server (172.28.92.56)
# Publishes the SPA on :3060 and proxies /api + /ws to the BE server.
# Run from: /opt/engpro/infra/staging
name: engpro-staging-fe

services:
  web:
    image: nginx:1.27-alpine
    container_name: engpro-staging-web
    ports:
      - "3060:80"
    volumes:
      - ./nginx.engpro-staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../apps/web/dist:/usr/share/nginx/html:ro
    restart: unless-stopped
