# EngPro FRONTEND — STAGING (FE server 172.28.92.56)
# Publishes the SPA on :3060 and proxies /api + /ws to the backend server.
# Run from /opt/engpro/frontend :  docker compose -f docker-compose.staging.yml up -d
# Requires the built SPA in ./dist (npm run build, or ship dist/ from CI).
name: engpro-staging-fe

services:
  web:
    image: nginx:1.27-alpine
    container_name: engpro-staging-web
    ports:
      - "3060:80"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    restart: unless-stopped
