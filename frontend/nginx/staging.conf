# EngPro STAGING — runs on the FE server (172.28.92.56), published on port 3060.
# Reached as http://test-ind-pm.kpndomain.com via the server's edge nginx / SLB
# (see edge-vhost.conf.example — the FE server hosts several subdomains side by side).
# Serves the SPA and proxies /api + /ws to the BE server (172.28.92.57:4010).
limit_req_zone $binary_remote_addr zone=engpro_auth:10m rate=10r/m;
# AR-02, second layer: the API throttles per authenticated user, but a request carrying an
# INVALID token is rejected before that guard runs. This bounds that flood by source address.
limit_req_zone $binary_remote_addr zone=engpro_api:10m rate=300r/m;
limit_conn_zone $binary_remote_addr zone=engpro_conn:10m;

server {
  listen 80;
  server_name test-ind-pm.kpndomain.com _;   # _ keeps direct :3060 access working

  # ── AR-10: Content-Security-Policy ────────────────────────────────────────
  # React escapes by default, so stored XSS is unlikely — but CSP is the control that limits
  # the damage if an injection or a compromised dependency ever does execute. script-src is
  # strict; 'unsafe-inline' is allowed for STYLES only, which CSS-in-JS and the font sheet need.
  #
  # The only third-party origins are Google Fonts (index.html). Self-hosting those fonts lets
  # you drop both fonts.* entries and remove the last external request the app makes — worth
  # doing before opening the app to external companies.
  set $engpro_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; form-action 'self'; base-uri 'none'; object-src 'none'";
  add_header Content-Security-Policy $engpro_csp always;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  # Uncomment once this host is served over TLS (see edge-vhost-tls.conf.example):
  # add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;

  client_max_body_size 2m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  limit_conn engpro_conn 40;
  gzip on;
  gzip_types text/css application/javascript application/json;

  root /usr/share/nginx/html;
  index index.html;

  location /api/v1/auth/login {
    limit_req zone=engpro_auth burst=10 nodelay;
    proxy_pass http://172.28.92.57:4010;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
  }
  location /api/ {
    limit_req zone=engpro_api burst=60 nodelay;
    proxy_pass http://172.28.92.57:4010;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }
  location /ws {
    proxy_pass http://172.28.92.57:4010;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 600s;
  }
  # Authenticated API responses must never be cached by a shared proxy.
  location ~* \.(js|css|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location / {
    try_files $uri /index.html;
  }
}
